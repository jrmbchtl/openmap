name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"

permissions: {}

jobs:
  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
