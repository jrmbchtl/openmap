name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.5
      - run: ruff check custom_components tests

  frontend:
    name: Build card bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify bundle is fresh
        run: |
          if [ -n "$(git status --porcelain custom_components/openmap/frontend/dist)" ]; then
            echo "::error::dist/openmap-card.js is outdated — run 'npm run build' and commit the result"
            git diff --stat
            exit 1
          fi

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component ruff==0.14.5
      - name: Run tests
        run: pytest tests/ -v --timeout=60 --cov=custom_components/openmap --cov-report=term
